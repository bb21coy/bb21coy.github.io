    <h3>You need to enable JavaScript to access the BB 21st Portal</h3>

    <ul>
      <li>Google Chrome:</li>
      <ol>
        <li>Open Chrome and click the three-dot menu in the top-right corner.</li>
        <li>Select "Settings."</li>
        <li>Navigate to "Privacy and security" > "Site Settings."</li>
        <li>Under "Content," click "JavaScript."</li>
        <li>Choose to "Sites can use JavaScript" (enabled) or "Don't allow sites to use JavaScript" (disabled). You can also manage exceptions for specific websites.</li>
      </ol>
      <li>Mozilla Firefox:</li>
      <ol>
        <li>Open Firefox and type about:config in the address bar, then press Enter.</li>
        <li>Accept the warning message if prompted.</li>
        <li>In the search bar, type javascript.enabled.</li>
        <li>Double-click the javascript.enabled preference to toggle its value between true (enabled) and false (disabled).</li>
      </ol>
      <li>Microsoft Edge:</li>
      <ol>
        <li>Open Edge and click the three-dot menu in the top-right corner.</li>
        <li>Select "Settings."</li>
        <li>Navigate to "Cookies and site permissions."</li>
        <li>Scroll down and click "JavaScript."</li>
        <li>Toggle the switch to enable or disable JavaScript for all sites, or manage exceptions for specific websites.</li>
      </ol>
      <li>Safari (macOS):</li>
      <ol>
        <li>Open Safari and click "Safari" in the menu bar, then select "Settings" (or "Preferences").</li>
        <li>Go to the "Security" tab.</li>
        <li>Check or uncheck the "Enable JavaScript" box to enable or disable it.</li>
      </ol>
    </ul>
