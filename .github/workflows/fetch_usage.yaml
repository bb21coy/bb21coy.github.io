name: Fetch Vercel Usage

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-usage:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false # important so we can use our own token

      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          installation-id: ${{ secrets.APP_INSTALLATION_ID }}

      - name: Fetch usage from Vercel API
        run: |
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://vercel.com/api/usage-summary?teamId=bb21coys-projects" \
            > public/usage.json

      - name: Commit & push JSON
        run: |
          git config user.name "vercel-usage-fetcher[bot]"
          git config user.email "vercel-usage-fetcher[bot]@users.noreply.github.com"
          git add public/usage.json
          git commit -m "Update Vercel Usage" || echo "No changes"
          git push https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }} HEAD:main
